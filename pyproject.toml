[project]
name = "ostdata"
requires-python = ">=3.12"

[tool.basedpyright]
# Django apps live in this directory (manage.py root).
extraPaths = ["."]
venvPath = ".."
venv = "ostdata_env"
pythonVersion = "3.12"
typeCheckingMode = "basic"
# DRF/Django do not ship complete stubs; stubs packages are optional/noisy for this repo.
reportMissingTypeStubs = "none"
reportUnusedImport = "none"
reportUnusedVariable = "none"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["ostdata_env", "node_modules", "frontend/dist", "old", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
